name: Build Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Mobile

    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.token_chat }}

      - name: 📱 Build APK (Android)
        # O segredo precisa ser injetado aqui para o comando EAS ler
        env:
          EXPO_TOKEN: ${{ secrets.token_chat }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: 🍎 Build iOS
        # E aqui também para a build de iOS
        env:
          EXPO_TOKEN: ${{ secrets.token_chat }}
        run: eas build --platform ios --profile preview --non-interactive --no-wait